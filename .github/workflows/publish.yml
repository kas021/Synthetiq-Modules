name: Validate and publish catalogue

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: module-catalogue-publish
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reject changed immutable packages
        if: github.event.before != '0000000000000000000000000000000000000000'
        run: |
          changed="$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- modules bundles || true)"
          for file in $changed; do
            if git cat-file -e "${{ github.event.before }}:$file" 2>/dev/null; then
              echo "Immutable package was modified: $file"
              exit 1
            fi
          done
      - name: Generate and validate signed index
        env:
          MODULE_REPOSITORY_SIGNING_JWK: ${{ secrets.MODULE_REPOSITORY_SIGNING_JWK }}
        run: node scripts/build_repository.mjs
      - name: Publish immutable versioned release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish_releases.mjs
      - name: Publish signed index to the default branch
        run: |
          if git diff --quiet -- repository.json SHA256SUMS; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repository.json SHA256SUMS
          git commit -m "Publish signed module catalogue [skip ci]"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: signed-module-catalogue
          path: |
            repository.json
            SHA256SUMS
