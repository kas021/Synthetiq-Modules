name: Validate and publish catalogue

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reject changed immutable packages
        if: github.event.before != '0000000000000000000000000000000000000000'
        run: |
          changed="$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- modules bundles || true)"
          for file in $changed; do
            if git cat-file -e "${{ github.event.before }}:$file" 2>/dev/null; then
              echo "Immutable package was modified: $file"
              exit 1
            fi
          done
      - name: Generate and validate signed index
        env:
          MODULE_REPOSITORY_SIGNING_JWK: ${{ secrets.MODULE_REPOSITORY_SIGNING_JWK }}
          PUBLISHED_AT_MS: ${{ github.run_id }}000
        run: node scripts/build_repository.mjs
      - name: Verify generated files are current
        run: git diff --exit-code -- repository.json SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: signed-module-catalogue
          path: |
            repository.json
            SHA256SUMS
